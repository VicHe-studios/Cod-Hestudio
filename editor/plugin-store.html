<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda de plugins · Cod-Hestudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F7F8FA;
      color: #101828;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #E4E7EC;
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 12px 16px -4px rgba(16,24,40,0.08);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #F4EBFF;
      color: #6941C6;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    p { color: #475467; line-height: 1.6; font-size: 0.95rem; }
    .plug {
      margin-top: 24px;
      padding: 16px;
      background: #F7F8FA;
      border: 1px dashed #D0D5DD;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #6941C6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Próximamente</div>
    <h1>Tienda de plugins</h1>
    <p>
      Aquí podrás explorar, instalar y activar plugins para Cod-Hestudio.
      Por ahora los plugins se cargan automáticamente desde <code>jsplugins.js</code>
      y se activan por defecto los primeros en el primer arranque.
    </p>
    <div class="plug">plugins/ · jsplugins.js</div>
  </div>
</body>
</html>
