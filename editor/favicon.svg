<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo morado con borde marcado -->
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="6" fill="#7F56D9" stroke="#5A36B0" stroke-width="1.2"/>

  <!-- Monitor: marco blanco grueso y pantalla violeta oscuro -->
  <rect x="3.2" y="4.6" width="25.6" height="17" rx="2.6" fill="#4B2C9E" stroke="#FFFFFF" stroke-width="2.4"/>

  <!-- Soporte y base -->
  <path d="M16 21.6 V25.4" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M10.8 26.6 H21.2" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>

  <!-- HE en mayúsculas dentro de la pantalla -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- H -->
    <path d="M9.8 8.4 V17.6 M14.2 8.4 V17.6 M9.8 13 H14.2"/>
    <!-- E -->
    <path d="M22.8 9.5 H18.4 V16.5 H22.8 M18.4 13 H21.8"/>
  </g>
</svg>
